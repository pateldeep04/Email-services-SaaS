version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailbridge-app
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-${MONGODB_URI:-mongodb://mongo:27017/mailbridge}}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/mailbridge}}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_me_in_prod}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - CLIENT_URL=${CLIENT_URL:-}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6.0
    container_name: mailbridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
