services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: mailbridge-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-${MONGODB_URI:-mongodb://mongo:27017/mailbridge}}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/mailbridge}}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_me_in_prod}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - FROM_NAME=${FROM_NAME:-MailBridge}
      - MAILBRIDGE_API_KEY=${MAILBRIDGE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLIENT_URL=${CLIENT_URL:-https://mail-bridge.email}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMS_OTP_NUMBER=${SMS_OTP_NUMBER:-}
      - SMS_SIMULATION_MODE=${SMS_SIMULATION_MODE:-false}
      - SMS_USE_ADB=${SMS_USE_ADB:-false}
      - SMS_GATEWAY_URL=${SMS_GATEWAY_URL:-}
      - SMS_GATEWAY_USER=${SMS_GATEWAY_USER:-}
      - SMS_GATEWAY_PASS=${SMS_GATEWAY_PASS:-}
      - SMS_DEVICE_ID=${SMS_DEVICE_ID:-}

  mongo:
    image: mongo:6.0
    container_name: mailbridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
