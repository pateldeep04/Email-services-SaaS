<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318" />
      <stop offset="100%" stop-color="#1c202a" />
    </linearGradient>
    <linearGradient id="mb-bridge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="mb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Square Charcoal Background with Border -->
  <rect width="512" height="512" rx="128" fill="url(#mb-bg-grad)" stroke="#272d3b" stroke-width="8" />
  
  <!-- Bridge Arch in Electric Blue -->
  <path d="M 96 360 C 160 220, 352 220, 416 360" 
        fill="none" 
        stroke="url(#mb-bridge-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        filter="url(#mb-glow)" />
        
  <!-- Support Pillars in Crisp White -->
  <line x1="180" y1="290" x2="180" y2="360" stroke="#ffffff" stroke-width="10" opacity="0.45" stroke-linecap="round" />
  <line x1="256" y1="276" x2="256" y2="360" stroke="#ffffff" stroke-width="10" opacity="0.45" stroke-linecap="round" />
  <line x1="332" y1="290" x2="332" y2="360" stroke="#ffffff" stroke-width="10" opacity="0.45" stroke-linecap="round" />
  
  <!-- Floating Envelope Container in Crisp White -->
  <rect x="146" y="110" width="220" height="140" rx="20" fill="#ffffff" />
  
  <!-- Envelope Flap in Vibrant Red -->
  <path d="M 146 110 L 256 182 L 366 110" fill="none" stroke="#ef233c" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Dynamic Envelope Corner Lines in Electric Blue -->
  <path d="M 146 250 L 226 195" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />
  <path d="M 366 250 L 286 195" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />
</svg>
